name: Deploy Mon Energie Web

on:
  push:
    branches:
      - main
    paths:
      - 'web-v012/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Mon Energie Web v0.1.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R web-v012/site/. _site/
          cat web-v012/app.part*.b64 \
            | tr -d '\n\r' \
            | base64 -d \
            | gzip -d > _site/app.js
          node --check _site/app.js
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/app.js
          test -f _site/service-worker.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
