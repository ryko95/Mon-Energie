name: Build Mon Energie APK

on:
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source/source.part*.b64 | tr -d '\n\r' | base64 -d > mon_energie_source.tar.gz
          tar -xzf mon_energie_source.tar.gz
          test -f wattsuivi_ci/pubspec.yaml
          test -f wattsuivi_ci/lib/main.dart

      - name: Generate Android platform
        working-directory: wattsuivi_ci
        shell: bash
        run: |
          set -euo pipefail
          TMP_BACKUP="$(mktemp -d)"
          cp -R lib "$TMP_BACKUP/lib"
          cp pubspec.yaml "$TMP_BACKUP/pubspec.yaml"
          cp analysis_options.yaml "$TMP_BACKUP/analysis_options.yaml"

          flutter create --project-name mon_energie --org ci.monenergie --platforms=android .

          rm -rf lib
          cp -R "$TMP_BACKUP/lib" lib
          cp "$TMP_BACKUP/pubspec.yaml" pubspec.yaml
          cp "$TMP_BACKUP/analysis_options.yaml" analysis_options.yaml

      - name: Configure Android build
        working-directory: wattsuivi_ci
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          gradle = root / 'android/app/build.gradle.kts'
          g = gradle.read_text()

          if 'minSdk = flutter.minSdkVersion' in g:
              g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24\n        multiDexEnabled = true')
          elif 'minSdk = 24' in g and 'multiDexEnabled' not in g:
              g = g.replace('minSdk = 24', 'minSdk = 24\n        multiDexEnabled = true')

          if 'isCoreLibraryDesugaringEnabled = true' not in g:
              g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)

          if 'text-recognition-chinese:16.0.1' not in g:
              deps = (
                  '\n\ndependencies {\n'
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  '    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")\n'
                  '    implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")\n'
                  '    implementation("com.google.mlkit:text-recognition-japanese:16.0.1")\n'
                  '    implementation("com.google.mlkit:text-recognition-korean:16.0.1")\n'
                  '}\n'
              )
              g += deps

          gradle.write_text(g)

          manifest = root / 'android/app/src/main/AndroidManifest.xml'
          m = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = (
              '\n    <uses-permission android:name="android.permission.CAMERA" />'
              '\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          )
          if 'android.permission.CAMERA' not in m:
              m = m.replace(marker, marker + permissions)
          manifest.write_text(m)
          PY

      - name: Resolve dependencies
        working-directory: wattsuivi_ci
        run: flutter pub get

      - name: Analyze application
        working-directory: wattsuivi_ci
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: wattsuivi_ci
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp wattsuivi_ci/build/app/outputs/flutter-apk/app-release.apk dist/Mon-Energie-v0.1.0.apk
          sha256sum dist/Mon-Energie-v0.1.0.apk > dist/Mon-Energie-v0.1.0.sha256
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Energie-APK-v0.1.0
          path: |
            dist/Mon-Energie-v0.1.0.apk
            dist/Mon-Energie-v0.1.0.sha256
          if-no-files-found: error
          retention-days: 30
